<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<meta name="robots" content="noindex">
<title>Abo-Übersicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // Theme vor dem ersten Zeichnen setzen, damit es nicht hell aufblitzt
  try { var t = JSON.parse(localStorage.getItem('abo.theme')); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titles">
      <span class="eyebrow" id="rangeLabel">&nbsp;</span>
      <div class="titlerow">
        <h1 id="title">Deine Abos</h1>
        <div class="hbtns">
        <button class="iconbtn" id="themeBtn" aria-label="Darstellung"></button>
        <button class="iconbtn" id="savedBtn" aria-label="Merkliste" aria-pressed="false">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
          <span class="badge" id="savedCount" hidden></span>
        </button>
        <button class="iconbtn" id="refresh" aria-label="Aktualisieren" aria-haspopup="dialog">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        </div>
      </div>
      <span class="stats" id="stats">Lade …</span>
    </div>

    <div id="mainControls" class="controls">
      <div class="range" id="rangeBox" role="group" aria-label="Zeitraum in Tagen">
        <div class="rangehead">
          <span class="label" id="rangeText">Zeitraum</span>
          <span class="hint">Lange drücken = abhaken</span>
        </div>
        <div class="rangebtns" id="ranges"></div>
      </div>

      <div class="chips listchips" id="lists" role="group" aria-label="Eigene Listen"></div>
    </div>
  </header>

  <main class="list" id="list">
    <form class="lock" id="lock" hidden>
      <h2>Übersicht entsperren</h2>
      <p>Gib das Passwort ein, das du bei GitHub als <code>APP_PASSWORD</code> hinterlegt hast. Die App merkt es sich auf diesem Gerät.</p>
      <label for="pw">Passwort</label>
      <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
      <label class="showpw"><input type="checkbox" id="showPw"> Passwort anzeigen</label>
      <button type="submit" class="tbtn primary" id="unlockBtn">Entsperren</button>
      <p class="lockmsg" id="lockMsg" role="alert"></p>
    </form>
    <div class="stale" id="stale" role="status" hidden></div>
    <section class="digest" id="digest" hidden>
      <button class="digesthead" id="digestToggle" aria-expanded="true" aria-controls="digestText">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.8 20 12 16.4 7.2 20 9 13.6 4 10l6.1-1.2z"/></svg>
        <span class="dtitle">Kurz gesagt</span>
        <span class="digestsub">bis gestern</span>
        <svg class="chev" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <p id="digestText"></p>
    </section>
    <div class="filters" id="filters" hidden>
      <div class="search" id="searchBox" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <label class="sr" for="q">Suche nach Titel oder Kanal</label>
        <input type="search" id="q" placeholder="Titel oder Kanal suchen" autocomplete="off" enterkeyhint="search">
        <button id="qClear" aria-label="Suche schließen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
      <div class="chips durchips" id="durs" role="group" aria-label="Dauer und Gesehen"></div>
    </div>
    <div class="toolbar" id="toolbar"></div>
    <div id="groups"></div>
    <p class="foot" id="mutedbar" hidden></p>
    <p class="foot" id="foot"></p>
    <p class="foot">Nach rechts wischen = merken · nach links = gesehen · ⋯ beim Kanal = Listen &amp; stumm</p>
    <p class="foot" id="backup">
      <button class="linkbtn" data-act="export">Sichern</button> ·
      <button class="linkbtn" data-act="import">Wiederherstellen</button>
      <input type="file" id="backupFile" accept="application/json,.json" hidden>
    </p>
    <p class="foot"><button class="linkbtn" id="lockBtn" data-act="lock" hidden>App sperren</button></p>
    <p class="foot"><a href="datenschutz.html" style="color: inherit">Datenschutz</a></p>
  </main>
</div>
<div class="sheet" id="sheet" hidden>
  <button class="sheetbg" data-act="closesheet" aria-label="Schließen" tabindex="-1"></button>
  <div class="sheetpanel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden>
  <span id="toastText"></span>
  <button id="toastUndo">Rückgängig</button>
</div>
<script src="app.js"></script>
</body>
</html>
