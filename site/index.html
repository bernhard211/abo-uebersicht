<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F5F2">
<meta name="robots" content="noindex">
<title>Abo-Übersicht</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="titlerow">
      <div class="titles">
        <span class="eyebrow" id="rangeLabel">&nbsp;</span>
        <h1>Deine Abos</h1>
        <span class="stats" id="stats">Lade …</span>
      </div>
      <button class="iconbtn" id="refresh" aria-label="Aktualisieren">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
    </div>

    <div class="range" role="group" aria-label="Zeitraum in Tagen">
      <span class="label" id="rangeText">Zeitraum</span>
      <div class="rangebtns" id="ranges"></div>
    </div>

    <div class="seg" role="group" aria-label="Gruppieren nach">
      <button data-group="thema" aria-pressed="true">Nach Thema</button>
      <button data-group="kanal" aria-pressed="false">Nach Kanal</button>
    </div>

    <div class="chips" id="chips" role="group" aria-label="Themenfilter"></div>
  </header>

  <main class="list" id="list">
    <section class="digest" id="digest" hidden>
      <div class="digesthead">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.8L20 10l-5 3.6L16.8 20 12 16.4 7.2 20 9 13.6 4 10l6.1-1.2z"/></svg>
        <h2>Kurz gesagt</h2>
      </div>
      <p id="digestText"></p>
    </section>
    <div id="groups"></div>
    <p class="foot" id="foot"></p>
    <p class="foot"><a href="datenschutz.html" style="color: inherit">Datenschutz</a></p>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
