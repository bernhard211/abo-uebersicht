name: Übersicht aktualisieren

on:
  schedule:
    # Stündlich zwischen 8 und 23 Uhr UTC anstoßen – der Job "gate" lässt alles zwischen 10 und 0 Uhr
    # deutscher Zeit durch. So passt es in Sommer- UND Winterzeit. GitHub lässt geplante Läufe bei hoher
    # Last manchmal aus; durch den Stundentakt kommt der nächste spätestens eine Stunde später.
    - cron: "17 8-23 * * *"
  workflow_dispatch:        # manuell starten: Actions › Übersicht aktualisieren › Run workflow

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Uhrzeit prüfen (deutsche Zeit, stündlich von 10 bis 0 Uhr)
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manuell gestartet – läuft immer."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          H=$((10#$(TZ=Europe/Berlin date +%H))); M=$((10#$(TZ=Europe/Berlin date +%M)))
          # Geplant ist jeweils hh:17 – bei Verspätung zählt die Stunde, für die der Lauf gedacht war
          if [ "$M" -lt 17 ]; then H=$(( (H + 23) % 24 )); fi
          if [ "$H" -ge 10 ] || [ "$H" -eq 0 ]; then
            echo "Geplante Stunde $H Uhr – Übersicht wird aktualisiert."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Geplante Stunde $H Uhr – nicht vorgesehen, übersprungen."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Nur als Ersatz, falls kein Google-Login eingerichtet ist: Takeout-Liste aus einem Secret
      - name: Ersatz-Abo-Liste bereitstellen
        env:
          SUBSCRIPTIONS_CSV: ${{ secrets.SUBSCRIPTIONS_CSV }}
        run: |
          if [ -n "$SUBSCRIPTIONS_CSV" ]; then printf '%s\n' "$SUBSCRIPTIONS_CSV" > subscriptions.csv; fi

      # Zusammenfassungen und "Kurz gesagt" wiederverwenden (spart API-Kosten)
      - uses: actions/cache@v4
        with:
          path: data/
          key: summaries-${{ github.run_id }}
          restore-keys: summaries-

      - name: Übersicht bauen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub schaltet geplante Läufe in öffentlichen Repos nach 60 Tagen ohne Aktivität ab.
  # Ist der letzte Commit älter als 50 Tage, wird ein leerer Commit angelegt.
  keepalive:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Repo aktiv halten
        run: |
          LAST=$(git log -1 --format=%ct)
          AGE=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "Letzter Commit vor $AGE Tagen."
          if [ "$AGE" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Automatisch: Repo aktiv halten (geplante Läufe nicht abschalten)"
            git push
            echo "Leerer Commit angelegt."
          else
            echo "Nichts zu tun."
          fi
