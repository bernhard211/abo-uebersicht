# Einstellungen für die Abo-Übersicht

# Wie viele volle Tage zurück gesammelt werden (die App bietet "Heute" und 1 bis max_days)
max_days = 7

# Zeitzone für Tagesgrenzen ("Heute", "Kurz gesagt" bis gestern)
timezone = "Europe/Berlin"

# Shorts ausblenden?
include_shorts = false

# Datei mit deinen Abos (Google-Takeout-Export, siehe README)
subscriptions_file = "subscriptions.csv"

# Themen, in die Videos einsortiert werden.
# Leer lassen = Claude leitet beim ersten Lauf passende Themen aus deinen Abos ab und merkt sie sich.
# Eigene Liste eintragen = genau diese Themen, in dieser Reihenfolge als Filter in der App, z. B.:
#   topics = ["Technik", "Wissenschaft", "Heimwerken", "Kochen", "Musik"]
# Was nicht passt, landet unter "Sonstiges".
topics = []

[llm]
# Claude-Modell für Themen und Zusammenfassungen
model = "claude-haiku-5-5"
# Wie viele Videos pro Anfrage zusammengefasst werden
batch_size = 15
# Aufwand pro Antwort: "low" (sparsam, knapper), "medium", "high"
effort = "low"
